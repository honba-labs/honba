name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo check honba-market (no default features)
        run: cargo check -p honba-market --no-default-features

      - name: cargo check honba-api-wasm (wasm32)
        run: make check-wasm

      - name: wasm conformance (node)
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: make test-wasm

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test --doc
        run: cargo test --workspace --doc

      # Regenerates schema/domain, schema/openapi, schema/mcp and the .pyi stubs with the
      # Rust generator and fails on any modified or untracked file. The frontend TypeScript
      # check (make check-schema-ts) needs the sibling honba-frontend repo: local only.
      - name: codegen drift
        run: make check-codegen-ci

      - name: cargo doc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  dependency-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run scripts/dependency_graph.py
        run: python3 scripts/dependency_graph.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: install deps
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: build and install wheel via maturin
        working-directory: python
        run: |
          maturin develop

      - name: verify extension type stubs
        working-directory: python
        run: |
          python -m mypy.stubtest honba._honba

      - name: pytest
        working-directory: python
        run: |
          pytest -q tests/

      - name: lint (ruff)
        run: |
          # ruff is pinned in python/requirements-dev.txt (installed above)
          ruff check python
          ruff format --check python
