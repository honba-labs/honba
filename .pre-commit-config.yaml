repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: detect-private-key
  - repo: local
    hooks:
      - id: forbid-secret-files
        name: forbid committing .env / local secret files
        language: fail
        entry: "Secret file staged; keep it git-ignored (use .env.example for templates)"
        files: '(^|/)(\.env(\.(?!example$)[^/]*)?|[^/]*\.(local|secrets)\.toml)$|(^|/)secrets/'
