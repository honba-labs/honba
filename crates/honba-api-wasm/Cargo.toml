[package]
name = "honba-api-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM compute surface for Honba frontend (wasm32-unknown-unknown)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
honba-messages.workspace = true
honba-entities.workspace = true
honba-market.workspace = true
honba-indicators.workspace = true
honba-engine.workspace = true
honba-strategy.workspace = true
honba-sim.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
