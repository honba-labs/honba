[package]
name = "honba-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "honba"
path = "src/main.rs"

[dependencies]
# CLI + error handling
clap   = { version = "4", features = ["derive"] }
anyhow = "1"

# Config parsing (backtest.rs)
serde  = { version = "1", features = ["derive"] }
toml   = "0.8"

# Python embedding (py/mod.rs, py/pyclasses/*)
pyo3 = { version = "0.22", features = ["auto-initialize"] }

# Workspace crates
honba-messages        = { path = "../honba-messages" }
honba-entities        = { path = "../honba-entities" }
honba-market          = { path = "../honba-market" }
honba-engine          = { path = "../honba-engine" }
honba-analytics       = { path = "../honba-analytics" }
honba-data            = { path = "../honba-data" }
honba-strategy        = { path = "../honba-strategy" }
honba-testing         = { path = "../honba-testing" }
honba-sim             = { path = "../honba-sim" }
