[workspace]
resolver = "2"
members = [
    "crates/honba-messages",
    "crates/honba-entities",
    "crates/honba-engine",
    "crates/honba-strategy",
    "crates/honba-indicators",
    "crates/honba-signals",
    "crates/honba-portfolio",
    "crates/honba-testing",
    "crates/honba-sim",
    "crates/honba-py",
    "crates/honba-analytics",
    "crates/honba-feed",
    "crates/honba-cli",
    "crates/honba-market",
    "crates/honba-risk",
    "crates/honba-config",
    "crates/honba-codegen",
    "crates/honba-ports",
    "crates/honba-async",
    "crates/honba-sweep",
    "crates/honba-api",
    "crates/honba-api-rest",
    "crates/honba-api-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/honba-labs/honba"
rust-version = "1.75"

[workspace.dependencies]
honba-messages = { path = "crates/honba-messages" }
honba-entities = { path = "crates/honba-entities" }
honba-engine = { path = "crates/honba-engine" }
honba-strategy = { path = "crates/honba-strategy" }
honba-indicators = { path = "crates/honba-indicators" }
honba-signals = { path = "crates/honba-signals" }
honba-portfolio = { path = "crates/honba-portfolio" }
honba-testing = { path = "crates/honba-testing" }
honba-sim = { path = "crates/honba-sim" }
honba-py = { path = "crates/honba-py" }
honba-analytics = { path = "crates/honba-analytics" }
honba-feed = { path = "crates/honba-feed" }
honba-market = { path = "crates/honba-market" }
honba-risk = { path = "crates/honba-risk" }
honba-config = { path = "crates/honba-config" }
honba-codegen = { path = "crates/honba-codegen" }
honba-ports = { path = "crates/honba-ports" }
honba-async = { path = "crates/honba-async" }
honba-sweep = { path = "crates/honba-sweep" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "1"
sha2 = "0.10"
rand = "0.8"
chrono = { version = ">=0.4.20, <0.4.40", features = ["serde"] }
arrow = "53"
parquet = { version = "53", features = ["arrow"] }
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
async-trait = "0.1"
tracing = "0.1"
csv = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
schemars = { version = "0.8", features = ["derive"] }
itertools = "0.13"
indexmap = "2"
async-stream = "0.3"
futures = "0.3"
tokio-stream = "0.1"
http-body-util = "0.1"


honba-api = { path = "crates/honba-api" }
honba-api-rest = { path = "crates/honba-api-rest" }

# Default dev build = release-level optimisation + small debug info.
# opt-level 3 matches `--release`; `line-tables-only` keeps file:line in backtraces and profilers
# (no variable info) at a fraction of full debuginfo size. debug-assertions and overflow-checks
# stay on (dev defaults) so tests still catch invariant violations. `cargo test` uses this
# profile too. Override per run with CARGO_PROFILE_DEV_DEBUG=0 (CI does) or CARGO_PROFILE_DEV_OPT_LEVEL=0.
[profile.dev]
opt-level = 3
debug = "line-tables-only"
