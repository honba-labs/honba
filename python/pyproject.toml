[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "honba"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=15.0", "pydantic>=2.0", "httpx>=0.27", "websockets>=12.0", "typer>=0.12", "rich>=13.0"]

[project.optional-dependencies]
ai = ["openai>=1.0", "anthropic>=0.30", "litellm>=1.40", "mcp>=1.0"]
rl = ["torch>=2.2", "gymnasium>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
honba = "honba.cli.main:app"

[tool.maturin]
python-source = "."
module-name = "honba._lib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
