[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "honba._honba"
manifest-path = "../crates/honba-py/Cargo.toml"
python-source = "src"

[project]
name = "honba"
version = "0.1.0"
description = "Algorithmic trading engine, research framework, and financial screener"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Honba Labs" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0", "numpy>=1.24", "pyarrow>=15.0", "pydantic>=2.0", "httpx>=0.27", "websockets>=12.0", "typer>=0.12", "rich>=13.0", "yfinance>=0.2"]

[project.optional-dependencies]
ai = ["openai>=1.0", "anthropic>=0.30", "litellm>=1.40", "mcp>=1.0"]
rl = ["torch>=2.2", "gymnasium>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff==0.16.10", "mypy>=1.10"]

[project.scripts]
honba = "honba.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"
# Generated by honba-codegen and checked byte-for-byte by `make check-pyi`; never reformatted.
extend-exclude = ["src/honba/wire/generated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: long-running accuracy / amortised-cost sweeps; deselect with -m \"not slow\"",
]
